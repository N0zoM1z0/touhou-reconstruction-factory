[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touhou-reconstruction-factory"
version = "0.1.0"
description = "Evidence-first control plane for verified Touhou reconstruction projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Touhou Reconstruction Factory contributors" }]
dependencies = []

[project.scripts]
reconstruction-factory = "reconstruction_factory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reconstruction_factory = ["historical_fixtures/*.json", "knowledge/*.json"]
