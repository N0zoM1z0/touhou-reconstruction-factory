#   "/srv/reconstructions/th10/scripts/ghidra.py",
#   "/srv/reconstructions/th10/scripts/ghidra/DecompileFunctions.java",
#   "/srv/reconstructions/th10/scripts/ghidra/ExportArchitecture.java",
