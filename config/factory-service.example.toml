[[repositories]]
id = "th04"
path = "/srv/reconstructions/th04"
adapter_id = "th04-pc98-v1"
target_identity_ids = [
  "target:th04-main",
  "target:th04-maine",
  "target:th04-op",
  "target:th04-zun",
]

[[repositories]]
id = "th08"
path = "/srv/reconstructions/th08"
adapter_id = "th08-vc7-ledgers-v1"
target_identity_ids = ["target:th08-main"]
# Optional mutable state outside the repo, for a legacy wrapper that selects
# $HOME/.wineth08. Values stay private; only variable names and root counts are
# exposed by repository discovery.
# work_environment = { HOME = "/srv/reconstruction-state/th08-home" }
# work_state_roots = ["/srv/reconstruction-state/th08-home/.wineth08"]

[[repositories]]
id = "th09"
path = "/srv/reconstructions/th09"
adapter_id = "windows-pe-ledgers-v1"
target_identity_ids = ["target:th09-main"]
# Adjacent registered repositories are mounted read-only only for this repo's
# live shell. They generate hypotheses and never confer evidence or exactness.
reference_repository_ids = ["th08", "th095"]

[[repositories]]
id = "th095"
path = "/srv/reconstructions/th095"
adapter_id = "windows-pe-ledgers-v1"
target_identity_ids = ["target:th095-main"]
# work_environment = { WINEPREFIX = "/srv/reconstruction-state/th095/wine" }
# work_state_roots = ["/srv/reconstruction-state/th095/wine"]

[[repositories]]
id = "th10"
path = "/srv/reconstructions/th10"
adapter_id = "windows-pe-ledgers-v1"
target_identity_ids = ["target:th10-main"]
# TH095 remains useful as a provisional adjacent reference while its semantic
# reconstruction continues; all three references remain read-only hypotheses.
reference_repository_ids = ["th08", "th09", "th095"]

[[repositories]]
id = "th105"
path = "/srv/reconstructions/th105"
adapter_id = "windows-pe-ledgers-v1"
target_identity_ids = ["target:th105-main"]
