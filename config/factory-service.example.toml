# Trusted operator configuration. Keep the real file outside the public repository.
schema_version = 1
state_directory = "/var/lib/touhou-reconstruction-factory/state"
evidence_store = "/var/lib/touhou-reconstruction-factory/evidence"
policy = "../policies/strict-live-v1.json"
replay_timeout_seconds = 1800
worker_lease_seconds = 30
worker_poll_seconds = 1.0

# Optional and disabled by default when omitted. If enabled, Web clients receive
# opaque capabilities for disposable snapshots of committed source. Commands run
# without network, operator HOME, ignored targets, or the canonical worktree.
[workspace]
enabled = false
root = "/var/lib/touhou-reconstruction-factory/state/workspaces"
ttl_seconds = 86400
max_active = 4
max_snapshot_files = 20000
max_snapshot_bytes = 268435456
max_file_bytes = 67108864
command_timeout_seconds = 120
max_command_output_bytes = 1048576
max_patch_bytes = 4194304

# Optional live-repository provider for autonomous GPT-web reconstruction. Bash
# runs in the real registered worktree, sees ignored repo-local tools, and may
# create local Git commits. Network is unavailable, so remote Git push is not
# provided. Command output and before/after Git state are durable under root.
[repository_work]
enabled = false
root = "/var/lib/touhou-reconstruction-factory/state/repository-work"
command_timeout_seconds = 3600
max_command_output_bytes = 8388608
git_author_name = "gpt-web"
git_author_email = "gpt-web@example.invalid"

# Prefer one immutable Factory-managed installation for reusable executables
# such as Ghidra/JDK/toolchain packages. Per-game repositories select versions,
# wrappers, Wine prefixes, analysis projects, and Oracle workflows.
# Also mount the Factory contracts and docs read-only so Web prompts can read
# their named guidance paths even when ChatGPT does not inject plugin skills:
# shared_tool_roots = [
#   "/srv/touhou-reconstruction-factory/contracts",
#   "/srv/touhou-reconstruction-factory/docs",
# ]
shared_tool_roots = []

# Optional semantic-analysis bridges must be loopback-only. The factory calls
# only the backend's attested read tool and never forwards its host Bash tool.
[[analysis_providers]]
id = "th105-ida"
repository_id = "th105"
target_identity_id = "target:th105-main"
backend = "attested-ida-proxy-v1"
endpoint = "http://127.0.0.1:8768/private-mcp-path"
upstream_tool = "ida_call"
timeout_seconds = 120

[[repositories]]
id = "th04"
path = "/srv/reconstructions/th04"
adapter_id = "th04-pc98-v1"
target_identity_ids = [
  "target:th04-main",
  "target:th04-maine",
  "target:th04-op",
  "target:th04-zun",
]

[[repositories]]
id = "th08"
path = "/srv/reconstructions/th08"
adapter_id = "th08-vc7-ledgers-v1"
target_identity_ids = ["target:th08-main"]
# Optional mutable state outside the repo, for a legacy wrapper that selects
# $HOME/.wineth08. Values stay private; only variable names and root counts are
# exposed by repository discovery.
# work_environment = { HOME = "/srv/reconstruction-state/th08-home" }
# work_state_roots = ["/srv/reconstruction-state/th08-home/.wineth08"]

[[repositories]]
id = "th095"
path = "/srv/reconstructions/th095"
adapter_id = "windows-pe-ledgers-v1"
target_identity_ids = ["target:th095-main"]
# work_environment = { WINEPREFIX = "/srv/reconstruction-state/th095/wine" }
# work_state_roots = ["/srv/reconstruction-state/th095/wine"]

[[repositories]]
id = "th105"
path = "/srv/reconstructions/th105"
adapter_id = "windows-pe-ledgers-v1"
target_identity_ids = ["target:th105-main"]
